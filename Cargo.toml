[package]
name = "watchlist"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
notify = "8.1.0"
glob = "0.3.4"
shell-words = "1.1.1"
"dirs" = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ctrlc = { version = "3", features = ["termination"] }
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
